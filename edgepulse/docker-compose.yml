version: '3.8'

services:
  backend:
    build: .
    container_name: edgepulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://edgepulse:edgepulse_secret@postgres:5432/edgepulse_db
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DEMO_MODE=${DEMO_MODE:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: edgepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgepulse
      POSTGRES_PASSWORD: edgepulse_secret
      POSTGRES_DB: edgepulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
